<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stutee ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg,#fde2e4,#f9c5d1,#e6c1e6);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.card {
  background: rgba(255,255,255,0.96);
  padding: 50px 55px;
  border-radius: 32px;
  text-align: center;
  box-shadow: 0 25px 60px rgba(0,0,0,0.25);
  width: 360px;
}

h1 {
  color: #ff4d6d;
  font-size: 36px;
}

h2 {
  font-size: 22px;
  color: #444;
  margin: 22px 0 30px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 24px;
  position: relative;
}

button {
  font-size: 18px;
  padding: 14px 38px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
}

#yes {
  background: #ff4d6d;
  color: white;
}

#no {
  background: #f1f1f1;
  color: #555;
}

/* SLIDESHOW */
.slideshow {
  width: 260px;
  height: 260px;
  margin: 30px auto 0;
  position: relative;
  overflow: hidden;
  border-radius: 32px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.25);
}

.slide {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 1.5s ease;
}

.slide.active {
  opacity: 1;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1>💖 Stutee 💖</h1>
  <h2>Will you be my Valentine?</h2>

  <div class="buttons">
    <button id="yes">Yes ❤️</button>
    <button id="no">No 🙈</button>
  </div>
</div>

<script>
const yesBtn = document.getElementById("yes");
const noBtn  = document.getElementById("no");

noBtn.addEventListener("mouseenter", () => {
  noBtn.style.position = "absolute";
  noBtn.style.left = Math.random() * 120 + "px";
  noBtn.style.top  = Math.random() * 30 + "px";
});

yesBtn.addEventListener("click", () => {
  document.getElementById("card").innerHTML = `
    <h1>Yay, Stutee ❤️</h1>
    <p style="font-size:21px;color:#444;line-height:1.6;">
      Some people feel like a moment.<br>
      You feel like forever.<br><br>
      I’m so grateful I get to love you and be loved by you.<br><br>
      <b>Happy Valentine’s Day 💖</b>
    </p>

    <div class="slideshow">
      <div class="slide active" style="background-image:url('/index/images/5.jpg')"></div>
      <div class="slide" style="background-image:url('/index/images/3.jpg')"></div>
      <div class="slide" style="background-image:url('/index/images/2.jpg')"></div>
      <div class="slide" style="background-image:url('/index/images/4.jpg')"></div>
      <div class="slide" style="background-image:url('/index/images/1.jpg')"></div>
    </div>
  `;

  setTimeout(() => {
    const slides = document.querySelectorAll(".slide");
    let i = 0;
    setInterval(() => {
      slides[i].classList.remove("active");
      i = (i + 1) % slides.length;
      slides[i].classList.add("active");
    }, 3000);
  }, 500);
});
</script>

</body>
</html>
