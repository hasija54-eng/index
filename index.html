<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stutee ❤️</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #fdecef;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  .card {
    background: white;
    padding: 48px 52px;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 18px 40px rgba(0,0,0,0.18);
    position: relative;
    animation: pop 0.6s ease-out;
    min-width: 300px;
  }

  @keyframes pop {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  h1 {
    color: #ff4d6d;
    font-size: 34px;
    margin-bottom: 8px;
  }

  h2 {
    font-size: 21px;
    color: #333;
    margin: 22px 0 30px;
    font-weight: 500;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 24px;
    position: relative;
    height: 64px;
  }

  button {
    font-size: 17px;
    padding: 12px 34px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease;
  }

  #yes {
    background: #ff4d6d;
    color: white;
    box-shadow: 0 10px 22px rgba(255,77,109,.35);
  }

  #yes:hover {
    transform: scale(1.1);
    box-shadow: 0 14px 28px rgba(255,77,109,.45);
  }

  #no {
    background: #f1f1f1;
    color: #555;
  }

  .heart {
    position: absolute;
    bottom: -20px;
    font-size: 16px;
    animation: floatUp 7s linear infinite;
    opacity: .5;
    pointer-events: none;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: .6; }
    100% { transform: translateY(-110vh) scale(1.4); opacity: 0; }
  }
</style>
</head>

<body>

<audio id="hoverSound" preload="auto">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_42c2fd0c1d.mp3" type="audio/mpeg">
</audio>

<audio id="yesSound" preload="auto">
  <source src="https://cdn.pixabay.com/audio/2022/10/30/audio_1a59c3c5b6.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <h1>💖 Stutee 💖</h1>
  <h2>Will you be my Valentine?</h2>

  <div class="buttons">
    <button id="yes" onclick="yesClicked()">Yes ❤️</button>
    <button id="no" onmouseenter="moveNo()">No 🙈</button>
  </div>
</div>

<script>
  const hoverSound = document.getElementById("hoverSound");
  const yesSound = document.getElementById("yesSound");

  function moveNo() {
    const noBtn = document.getElementById("no");
    const container = document.querySelector(".buttons");

    const maxX = container.clientWidth - noBtn.offsetWidth;
    const maxY = 20;

    noBtn.style.position = "absolute";
    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";

    hoverSound.volume = 0.2;
    hoverSound.currentTime = 0;
    hoverSound.play();
  }

  function yesClicked() {
    yesSound.volume = 0.3;
    yesSound.play();

    document.body.innerHTML = `
      <div style="
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#fdecef;
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI';
        text-align:center;
      ">
        <div style="
          background:white;
          padding:56px;
          border-radius:32px;
          box-shadow:0 20px 45px rgba(0,0,0,.2);
          animation: pop .6s ease;
        ">
          <h1 style="color:#ff4d6d;font-size:36px;">Yay, Stutee ❤️</h1>
          <p style="font-size:21px;color:#444;line-height:1.45;">
          Some people feel like a moment.
          You feel like forever.
          I’m so grateful I get to love you and be loved by you.<br><br>
        
          Happy Valentine’s Day 💕
          </p>
        </div>
      </div>
    `;
  }

  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 8 + 14 + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
  }, 500);
</script>

</body>
</html>
