<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stutee ❤️</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #fdecef;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  .card {
    background: white;
    padding: 48px 52px;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 18px 40px rgba(0,0,0,0.18);
    animation: pop 0.6s ease-out;
    min-width: 320px;
  }

  @keyframes pop {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  h1 {
    color: #ff4d6d;
    font-size: 34px;
    margin-bottom: 10px;
  }

  h2 {
    font-size: 21px;
    color: #333;
    margin: 22px 0 30px;
    font-weight: 500;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 24px;
    position: relative;
    height: 64px;
  }

  button {
    font-size: 17px;
    padding: 12px 34px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
  }

  #yes {
    background: #ff4d6d;
    color: white;
    box-shadow: 0 10px 22px rgba(255,77,109,.35);
  }

  #no {
    background: #f1f1f1;
    color: #555;
    position: absolute;
  }

  .slideshow {
    width: 180px;
    height: 180px;
    margin: 25px auto 0;
    position: relative;
  }

  .slide {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    position: absolute;
    opacity: 0;
    transition: opacity 1.3s ease;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  }

  .slide.active {
    opacity: 1;
  }

  .heart {
    position: absolute;
    bottom: -20px;
    font-size: 16px;
    animation: floatUp 7s linear infinite;
    opacity: .6;
    pointer-events: none;
  }

  @keyframes floatUp {
    from { transform: translateY(0); }
    to { transform: translateY(-110vh); opacity: 0; }
  }
</style>
</head>

<body>

<div class="card" id="card">
  <h1>💖 Stutee 💖</h1>
  <h2>Will you be my Valentine?</h2>

  <div class="buttons">
    <button id="yes" onclick="yesClicked()">Yes ❤️</button>
    <button id="no" onmouseenter="moveNo()">No 🙈</button>
  </div>
</div>

<script>
  function moveNo() {
    const noBtn = document.getElementById("no");
    noBtn.style.left = Math.random() * 140 + "px";
    noBtn.style.top = Math.random() * 30 + "px";
  }

  function yesClicked() {
    document.body.innerHTML = `
      <div style="
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#fdecef;
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI';
        text-align:center;
      ">
        <div style="
          background:white;
          padding:56px;
          border-radius:32px;
          box-shadow:0 20px 45px rgba(0,0,0,.2);
        ">
          <h1 style="color:#ff4d6d;font-size:36px;">Yay, Stutee ❤️</h1>
          <p style="font-size:21px;color:#444;line-height:1.5;">
            Some people feel like a moment.<br>
            You feel like forever.<br><br>
            I’m so grateful I get to love you and be loved by you.<br><br>
            <b>Happy Valentine’s Day 💖</b>
          </p>

          <div class="slideshow">
            <img src="images/image%205.jpg" class="slide active">
            <img src="images/image%203.jpg" class="slide">
            <img src="images/image%202.jpg" class="slide">
            <img src="images/image%204.jpg" class="slide">
            <img src="images/image%201.jpg" class="slide">
          </div>
        </div>
      </div>
    `;

    setTimeout(() => {
      const slides = document.querySelectorAll(".slide");
      let index = 0;
      setInterval(() => {
        slides[index].classList.remove("active");
        index = (index + 1) % slides.length;
        slides[index].classList.add("active");
      }, 2600);
    }, 500);
  }

  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 8 + 14 + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
  }, 500);
</script>

</body>
</html>
