<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stutee ❤️</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg,#fde2e4,#f9c5d1,#e6c1e6);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.96);
  width: 380px;
  border-radius: 28px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.25);
  overflow: hidden; /* CRITICAL */
}

/* TEXT SECTION */
.content {
  padding: 42px 36px 28px;
  text-align: center;
}

h1 {
  color: #ff4d6d;
  font-size: 34px;
  margin-bottom: 16px;
}

p {
  font-size: 20px;
  color: #444;
  line-height: 1.55;
}

/* SLIDESHOW SECTION */
.slideshow {
  width: 100%;
  aspect-ratio: 1 / 1;   /* CRITICAL */
  position: relative;
  background: #000;      /* hides ALL white */
}

.slide {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 1.2s ease;
}

.slide.active {
  opacity: 1;
}
</style>
</head>

<body>

<div class="card">
  <div class="content" id="text">
    <h1>Yay, Stutee ❤️</h1>
    <p>
      Some people feel like a moment.<br>
      You feel like forever.<br><br>
      I’m so grateful I get to love you and be loved by you.<br><br>
      <b>Happy Valentine’s Day 💖</b>
    </p>
  </div>

  <div class="slideshow">
    <div class="slide active" style="background-image:url('/index/images/5.jpg')"></div>
    <div class="slide" style="background-image:url('/index/images/3.jpg')"></div>
    <div class="slide" style="background-image:url('/index/images/2.jpg')"></div>
    <div class="slide" style="background-image:url('/index/images/4.jpg')"></div>
    <div class="slide" style="background-image:url('/index/images/1.jpg')"></div>
  </div>
</div>

<script>
const slides = document.querySelectorAll('.slide');
let i = 0;

setInterval(() => {
  slides[i].classList.remove('active');
  i = (i + 1) % slides.length;
  slides[i].classList.add('active');
}, 3000);
</script>

</body>
</html>
